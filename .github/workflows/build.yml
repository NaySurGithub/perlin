name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  EMSDK_VERSION: 3.1.50
  OPENSSL_VERSION: openssl-3.0.15
  SDL_REF: release-3.4.18
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.31.5

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-${{ matrix.name }}-

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev libgl-dev libegl-dev libdrm-dev libgbm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxtst-dev libxrender-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev

      - name: Select Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-archives
          key: vcpkg-openssl-static-${{ runner.os }}

      - name: Install OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPERLIN_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DOPENSSL_ROOT_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPERLIN_BUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --install build --config Release --prefix dist

      - name: Keep debug symbols (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp build/Perlin.pdb dist/ 2>/dev/null || true
          cp build/Perlin.map dist/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Perlin-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  shaders:
    name: essl-shaders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-shaders-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libwayland-dev
      - name: Compile ESSL shaders
        run: |
          cmake -S . -B build-shaders -G Ninja -DPERLIN_WEB_SHADERS_ONLY=ON
          cmake --build build-shaders --target perlin_web_shaders
      - uses: actions/upload-artifact@v4
        with:
          name: essl-shaders
          path: build-shaders/shaders/essl
          if-no-files-found: error

  web:
    if: false
    name: web
    runs-on: ubuntu-24.04
    needs: shaders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-web-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3 perl
      - uses: actions/download-artifact@v4
        with:
          name: essl-shaders
          path: web-shaders/essl
      - name: Cache OpenSSL for wasm
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ossl-wasm
          key: openssl-wasm-${{ env.OPENSSL_VERSION }}-${{ env.EMSDK_VERSION }}
      - name: Build OpenSSL for wasm
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$OPENSSL_VERSION" https://github.com/openssl/openssl openssl-src
          cd openssl-src
          CC=emcc CXX=em++ AR=emar RANLIB=emranlib ./Configure linux-generic32 no-asm no-threads no-shared no-sock no-dso no-engine no-afalgeng no-ui-console no-tests no-stdio -pthread -fwasm-exceptions --prefix="$GITHUB_WORKSPACE/ossl-wasm" --openssldir="$GITHUB_WORKSPACE/ossl-wasm/ssl" -static
          make -j"$(nproc)" build_libs
          make install_dev
      - name: Configure
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPERLIN_WEB_SHADER_DIR="$GITHUB_WORKSPACE/web-shaders" \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/ossl-wasm" \
            -DOPENSSL_INCLUDE_DIR="$GITHUB_WORKSPACE/ossl-wasm/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$GITHUB_WORKSPACE/ossl-wasm/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$GITHUB_WORKSPACE/ossl-wasm/lib/libssl.a"
      - name: Build
        run: cmake --build build-web
      - name: Generate asset manifest
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/Mojang/bedrock-samples bedrock-samples-index
          python3 tools/web/gen_manifest.py --repo bedrock-samples-index --out build-web/assets-manifest.json
      - name: Assemble site
        run: |
          mkdir site
          cp build-web/index.html build-web/index.js build-web/index.wasm site/
          cp build-web/*.worker.js site/ 2>/dev/null || true
          cp build-web/*.data site/ 2>/dev/null || true
          cp build-web/perlin-*.js build-web/coi-sw.js build-web/perlin.css build-web/assets-manifest.json site/
          cp tools/web/serve.py site/serve.py
          mkdir dist
          (cd site && zip -qr ../dist/Perlin-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Perlin-web
          path: dist/Perlin-web.zip
          if-no-files-found: error

  android:
    if: false
    name: android
    runs-on: ubuntu-24.04
    needs: shaders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-android-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK components
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: essl-shaders
          path: android-shaders/essl
      - name: Fetch SDL
        run: git clone --depth 1 -b "$SDL_REF" https://github.com/libsdl-org/SDL android/sdl
      - name: Cache OpenSSL for Android
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ossl-android
          key: openssl-android-${{ env.OPENSSL_VERSION }}-${{ env.NDK_VERSION }}-v1
      - name: Build OpenSSL for Android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 -b "$OPENSSL_VERSION" https://github.com/openssl/openssl openssl-src
          for pair in arm64-v8a:android-arm64 x86_64:android-x86_64; do
            abi="${pair%%:*}"
            target="${pair##*:}"
            rm -rf "openssl-build-$abi"
            mkdir "openssl-build-$abi"
            (cd "openssl-build-$abi" && ../openssl-src/Configure "$target" -D__ANDROID_API__=26 no-shared no-tests no-ui-console no-engine no-dso no-stdio --prefix="$GITHUB_WORKSPACE/ossl-android/$abi" --openssldir="$GITHUB_WORKSPACE/ossl-android/$abi/ssl" && make -j"$(nproc)" build_libs && make install_dev)
          done
      - name: Generate asset manifest
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/Mojang/bedrock-samples bedrock-samples-index
          mkdir -p android/app/src/main/assets
          python3 tools/web/gen_manifest.py --repo bedrock-samples-index --out android/app/src/main/assets/assets-manifest.json
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PsdlDir="$GITHUB_WORKSPACE/android/sdl" \
            -PshaderDir="$GITHUB_WORKSPACE/android-shaders" \
            -PopensslBase="$GITHUB_WORKSPACE/ossl-android" \
            -PndkVersion="$NDK_VERSION" \
            -PcmakeVersion="$CMAKE_VERSION" \
            -Pabis="arm64-v8a,x86_64" \
            -PappVersionCode="$GITHUB_RUN_NUMBER" \
            -PappVersionName="1.0.$GITHUB_RUN_NUMBER"
      - name: Collect APK
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/*.apk dist/Perlin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Perlin-android
          path: dist/Perlin.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive
        run: |
          cd artifacts
          mkdir ../release
          for dir in */; do
            name="${dir%/}"
            case "$name" in
              Perlin-web|Perlin-android) cp "$name"/* ../release/ ;;
              *) (cd "$name" && zip -qr "../../release/$name.zip" .) ;;
            esac
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
